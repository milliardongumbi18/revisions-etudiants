{% extends "base.html" %}

{% block title %}Supprimer · Révisions Étudiants{% endblock %}

{% block content %}
<section class="container-app flex justify-center py-16 md:py-24">
  <div class="animate-in card auth-card w-full max-w-md text-center">
    <div class="icon-tile mx-auto" style="--tile: var(--danger)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    </div>
    <h1 class="mt-5 break-words text-2xl font-bold">Supprimer « {{ object }} » ?</h1>
    <p class="text-muted mt-2">{{ warning }}</p>

    <form method="post" class="mt-8 flex flex-wrap justify-center gap-3" data-auth-form>
      {% csrf_token %}
      <a href="{{ cancel_url }}" class="btn btn-ghost">Annuler</a>
      <button type="submit" class="btn btn-danger">Supprimer définitivement</button>
    </form>
  </div>
</section>
{% endblock %}
