{# Un champ de formulaire : libellé, champ, puis erreur OU texte d'aide #}
<div class="field">
  <label class="label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="text-muted" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.errors %}
    {% for error in field.errors %}
      <p class="field-error">{{ error }}</p>
    {% endfor %}
  {% elif field.help_text %}
    <div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
  {% endif %}
</div>
