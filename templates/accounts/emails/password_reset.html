<!DOCTYPE html>
<html lang="fr">
<body style="margin:0;padding:24px;background:#fbf6ee;font-family:Arial,Helvetica,sans-serif;color:#1b2240;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e9dccb;border-radius:16px;">
        <tr><td style="padding:32px;">
          <p style="margin:0;font-size:13px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;color:#c4572e;">Révisions Étudiants</p>
          <h1 style="margin:12px 0 0;font-size:22px;">Réinitialise ton mot de passe</h1>
          <p style="margin:16px 0 0;line-height:1.6;">Bonjour {{ user.get_username }}, tu as demandé à choisir un nouveau mot de passe. Ce lien est valable <strong>1 heure</strong>.</p>
          <p style="margin:28px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
               style="display:inline-block;padding:14px 24px;background:#f08a2e;color:#ffffff;font-weight:bold;text-decoration:none;border-radius:12px;">
              Choisir un nouveau mot de passe
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#5d6382;">Si tu n'es pas à l'origine de cette demande, ignore cet e-mail : ton mot de passe ne change pas.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
