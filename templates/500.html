{% extends "base.html" %}

{% block title %}Erreur · Révisions Étudiants{% endblock %}

{% block content %}
<section class="hero">
  <div class="container-app flex flex-col items-center py-20 text-center md:py-28">
    <div class="animate-in"><p class="error-code">500</p></div>
    <h1 class="animate-in mt-4 text-3xl font-extrabold md:text-4xl" style="--delay: 100ms">Oups, quelque chose s'est mal passé</h1>
    <p class="animate-in text-muted mt-3 max-w-md" style="--delay: 180ms">
      L'erreur a été enregistrée. Réessaie dans un instant.
    </p>
    <div class="animate-in mt-8" style="--delay: 260ms">
      <a href="{% url 'core:home' %}" class="btn btn-primary">Retour à l'accueil</a>
    </div>
  </div>
</section>
{% endblock %}
